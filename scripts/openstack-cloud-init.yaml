#cloud-config by Codex, thanks Codex
package_update: true
package_upgrade: false # if true, causes race condition with cloud-init

runcmd:
  - [ sh, -lc, "apt-get update" ]
  - [ sh, -lc, "apt-get install -y ca-certificates curl gnupg" ]
  - [ sh, -lc, "install -m 0755 -d /etc/apt/keyrings" ]
  - [ sh, -lc, "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg" ]
  - [ sh, -lc, "chmod a+r /etc/apt/keyrings/docker.gpg" ]
  - [ sh, -lc, "echo \"deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable\" > /etc/apt/sources.list.d/docker.list" ]
  - [ sh, -lc, "apt-get update" ]
  - [ sh, -lc, "apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin" ]
  - [ sh, -lc, "systemctl enable --now docker" ] # configures docker to start at boot time and also start it right now
  - [ sh, -lc, "id -u ubuntu >/dev/null 2>&1 && usermod -aG docker ubuntu || true" ] # add ubuntu to docker group when present
  - [ sh, -lc, "if [[ ! -f /swapfile ]]; then fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab; fi" ]
  - [ sh, -lc, "echo 'vm.swappiness=10' > /etc/sysctl.d/99-daps.conf && sysctl -p /etc/sysctl.d/99-daps.conf" ]
