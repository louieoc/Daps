## DAPS Grist Template — Base Compose File
##
## This file is shared across dev and prod. It is always used together with
## either compose_mygrist.dev.yaml or compose_mygrist.prod.yaml.
##
## SETUP: Replace every occurrence of "mygrist" with your project name.

name: mygrist

networks:
  daps_net:
    external: true

## NOTE on env_file path resolution:
## The path below is relative to this compose file's directory (_docker/).
## ../_secrets/.env correctly points to _secrets/.env in the project root.
## This file is generated by prerequisites.sh on first build.

services:
  grist:
    image: gristlabs/grist:latest
    restart: unless-stopped
    env_file:
      - ../_secrets/.env
    environment:
      # SETUP: replace with your email address. Used as the default account in dev and prod.
      # Override in compose_mygrist.prod.yaml with your real email before deploying.
      GRIST_DEFAULT_EMAIL: admin@example.com
    networks:
      daps_net:
        aliases:
          - mygrist
